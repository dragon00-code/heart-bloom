<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Classic Snake</title>
    <style>
      :root {
        color-scheme: dark;
        font-family: "Avenir Next", "Trebuchet MS", "Segoe UI", sans-serif;
        --bg-a: #07141a;
        --bg-b: #03080c;
        --panel: rgba(9, 21, 27, 0.72);
        --line: rgba(150, 236, 205, 0.16);
        --text: #e9fff6;
        --muted: rgba(227, 255, 245, 0.74);
        --accent: #72f0bf;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        margin: 0;
        min-height: 100%;
      }

      body {
        color: var(--text);
        background:
          radial-gradient(circle at top, rgba(114, 240, 191, 0.18), transparent 28%),
          radial-gradient(circle at 80% 20%, rgba(89, 196, 255, 0.12), transparent 20%),
          linear-gradient(180deg, var(--bg-a), var(--bg-b) 72%);
      }

      a {
        color: inherit;
        text-decoration: none;
      }

      .shell {
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 1.5rem;
      }

      .card {
        width: min(100%, 44rem);
        padding: clamp(1.2rem, 3vw, 2rem);
        border: 1px solid var(--line);
        border-radius: 1.8rem;
        background:
          linear-gradient(180deg, rgba(255, 255, 255, 0.06), rgba(255, 255, 255, 0.02)),
          var(--panel);
        box-shadow:
          0 30px 90px rgba(0, 0, 0, 0.36),
          inset 0 1px 0 rgba(255, 255, 255, 0.05);
        backdrop-filter: blur(18px);
      }

      .eyebrow {
        margin: 0;
        color: #bff5dd;
        letter-spacing: 0.22em;
        font-size: 0.76rem;
        text-transform: uppercase;
      }

      h1 {
        margin: 0.55rem 0 0;
        font-size: clamp(2.4rem, 7vw, 4rem);
        line-height: 1;
      }

      .lead {
        margin: 1rem 0 0;
        color: var(--muted);
        line-height: 1.65;
      }

      .list {
        display: grid;
        gap: 0.75rem;
        margin: 1.2rem 0 0;
        padding: 0;
        list-style: none;
      }

      .item {
        padding: 0.9rem 1rem;
        border-radius: 1rem;
        border: 1px solid rgba(150, 236, 205, 0.12);
        background: rgba(255, 255, 255, 0.03);
      }

      .item strong {
        display: block;
        margin-bottom: 0.25rem;
      }

      .actions {
        display: flex;
        flex-wrap: wrap;
        gap: 0.8rem;
        margin-top: 1.3rem;
      }

      .button {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-height: 2.8rem;
        padding: 0.75rem 1.1rem;
        border-radius: 999px;
        border: 1px solid rgba(190, 255, 232, 0.18);
        background: linear-gradient(135deg, #7df2c5, #2dd88f);
        color: #04110b;
        font-weight: 700;
      }

      .button--ghost {
        background: rgba(255, 255, 255, 0.04);
        color: var(--text);
      }
    </style>
  </head>
  <body>
    <main class="shell">
      <section class="card">
        <p class="eyebrow">Classic Snake</p>
        <h1>贪吃蛇核心逻辑</h1>
        <p class="lead">
          这个项目保留了贪吃蛇的规则实现和测试用例，适合在 GitHub Pages 上作为静态说明页展示。
          它本身不依赖后端，逻辑完全由 `src/game.js` 控制。
        </p>

        <ul class="list">
          <li class="item">
            <strong>游戏规则</strong>
            蛇移动、吃食物增长、禁止反向移动、撞墙和撞身体都会结束游戏。
          </li>
          <li class="item">
            <strong>源码位置</strong>
            <code>/src/game.js</code> 保存核心规则，<code>/test/game.test.js</code> 保存单元测试。
          </li>
          <li class="item">
            <strong>本地验证</strong>
            在仓库根目录运行 <code>npm test</code> 即可执行测试。
          </li>
        </ul>

        <div class="actions">
          <a class="button" href="../src/game.js">查看 game.js</a>
          <a class="button button--ghost" href="../test/game.test.js">查看测试</a>
        </div>
      </section>
    </main>
  </body>
</html>
