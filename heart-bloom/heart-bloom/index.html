<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover"
    />
    <title>Heart Bloom</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <canvas class="sky" data-sky aria-hidden="true"></canvas>

    <main class="scene">
      <section class="hero">
        <p class="hero__eyebrow">MOBILE HEART FX</p>
        <h1>Heart Bloom</h1>
        <p class="hero__copy">
          轻触屏幕，爱心会像烟火一样散开。长按拖动时，整片夜空都会跟着发光。
        </p>

        <div class="heart-stage" aria-hidden="true">
          <div class="heart-stage__halo heart-stage__halo--outer"></div>
          <div class="heart-stage__halo heart-stage__halo--inner"></div>
          <div class="heart" data-heart></div>
        </div>

        <div class="hero__actions">
          <button type="button" class="burst-button" data-burst>
            点亮爱心
          </button>
          <p class="hero__hint" data-hint>
            点击任意位置，或者在手机上滑动手指试试。
          </p>
        </div>
      </section>
    </main>

    <script type="module" src="./app.js"></script>
  </body>
</html>
